# Numeric criteria of research-v1. They take precedence over PROTOCOL.md. Frozen by the tag research-protocol-v1;
# their sha256 is verified by the engine at startup (tag research-engine-v1).
version: research-v1

data:
  cutoff_excluded: "2026-07-01T00:00:00Z"        # nothing equal or later, in any form
  evaluation_window: {start: "2020-01-01", end: "2026-06-30"}
  perp_window_end: "2026-06-29"
  warmup: "2018-01-01 -> 2019-12-31"
  universe: [ADAUSDT, ATOMUSDT, AVAXUSDT, BCHUSDT, BNBUSDT, BTCUSDT, DOGEUSDT, DOTUSDT, ETCUSDT, ETHUSDT, LINKUSDT, LTCUSDT, SOLUSDT, TRXUSDT, XRPUSDT]
  arena_universe: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, LINKUSDT, LTCUSDT]
  control_universe: {size: 20, rule: "largest quote volumes of January 2020 on data.binance.vision (spot USDT), outside the universe, delisted symbols included, stablecoins and leveraged tokens excluded; frozen before wave 1"}
  tolerances: {gaps_1d: 0, max_gaps_1h_share: 0.001, max_consecutive_gaps_1h: 6}
  known_at: {bar: "open_time + duration", funding: "fundingTime + 1 s"}

costs_bp:                       # aligned with config/arena.toml (taker_fee_bp 50, slippage_bp 5) + demi-spread 5
  spot_per_rotation: 60
  perp_per_rotation: 10         # plus actual funding
  stress_multiplier: 2
  perp_share_margin: 0.5          # capital tied up = spot notional + 0.5 x perp short notional

classes:
  directional: {min_weight: 0, max_sum: 1, drawdown_max: 0.45, max_annual_turnover: 15}
  hedged: {short_perp_max: "<= spot long of the same pair", drawdown_max: 0.20, max_annual_turnover: 40}

trials:
  N_dsr: 726                    # 126 (lab, final freeze) + 600 (research-v1 cap), whatever the timing
  total_cap: 600
  wave_1_cap: 120
  max_families_per_wave: 6
  max_variants_per_family_wave_1: 20
  min_parameters: 2
  max_parameters: 4
  grid: {min_values_per_parameter: 3, min_ratio_between_neighbors: 1.25}
  stop_after_wave_1: {dsr_max_below: 0.5, effect: "wave 2 only on a written owner decision"}
  walk_forward: forbidden_in_v1

dsr:
  formula: "Bailey & López de Prado (2014), as in the lab's dsr.py tool"
  variance: "per class: max(family-weighted mean of the variances of the research sr_day, 1/(T-1)); lab excluded from V, included in N"
  threshold: 0.95

gates:
  C1_dsr_min: 0.95
  C5_years: {years: [2020, 2021, 2022, 2023, 2024, 2025], min_sharpe_per_year: -1.0, min_positive_years: 4}
  C6_drawdown_max: {directional: 0.45, hedged: 0.20}
  C7_neighborhood: {min_neighbors_share: 0.75, min_neighbor_sharpe_ratio: 0.6, min_neighbor_sharpe: 0.5, grid_edge: failure}
  C8_directional: {paired_bootstrap_block_days: 20, replications: 5000, seed: 12345, p_unilateral_max: 0.05, basket: "equal-weighted over the candidate's universe, rebalanced on the 1st of the month, same costs"}
  C8_hedged: {alpha_t_newey_west_min: 2.0, delays: 20, beta_abs_max: 0.3}
  C9_causality: {random_cutoffs: 20, fixed_cutoffs: 3, min_non_full_hour_share: 0.4, tolerance: 1.0e-9, data: synthetic}
  C11_extremes: {withdrawal_share_1: 0.01, min_sharpe_after_1: "max(0.5, 0.5 x full sharpe)", withdrawal_share_2: 0.02, min_sharpe_after_2: 0.0}
  C12_costs: {max_cost_on_gross_return: 0.5}
  C13_halves: {min_sharpe_each_half: 0.0}
  C14_materiality: {min_net_annualized_return: 0.04}
  C15_arena: {policy: "config/policy-strategy.toml", sharpe_min: 0.0, max_drawdown_factor_C6: 1.3}
  C16_outside_universe: {min_positive_sharpe_symbols_share: 0.6}

consistency:                      # anti-bug checks, required but not counted as independent gates
  C2_sharpe_net_min: 0.5
  C3_t_newey_west_min: 2.0
  C4_sharpe_stress_min: 0.0
  C10_bootstrap: {block_days: 20, replications: 5000, seed: 12345, p_unilateral_max: 0.05}

selection:
  max_candidates: 3
  max_basket_excess_correlation: 0.7
  ranking: dsr_descending

paper:
  labels: [refuted, not_refuted, technical_failure]
  replication: {min_daily_correlation: 0.95, max_cumulative_gap_stressed_cost_factor: 1.5}
  refutation: {max_cumulative_return_vol_factor_56_days: -0.5, max_cumulative_return_vol_factor_84_days: -0.6, max_drawdown_factor_backtest: 1.3}
  looks: {frequency: weekly, alpha_spending: obrien_fleming, alpha_total: 0.05}
  min_duration_days: {spot: 56, leverage_or_perp: 84}
  confirmation: "90% CI of the forward Sharpe > 0 (~300 days for SR 1.8; ~1,000 days for SR 1)"

execution:
  sandbox: bwrap
  return_codes: [OK, CAUSALITY, TIMEOUT, SOURCE_REFUSED, WEIGHT_SHAPE, ERROR]
  trial_timeout_s: 600
