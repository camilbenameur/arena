# Calendrier macro des États-Unis, relevé le 15/11/2026 sur les calendriers officiels
# (docs/SPEC-PERP-ACTUALITES.md §3). Heures en UTC : 8 h 30 ET = 13:30Z jusqu'au 14/03/2027, 12:30Z ensuite ;
# communiqué du FOMC à 14 h ET = 19:00Z, puis 18:00Z.
# - FOMC : page de la Fed relue le 15/11 (réunions de 2027 provisoires jusqu'à la réunion précédente).
# - BEA (PIB, PCE) : fichier .ics officiel, recoupé le 15/11.
# - BLS (CPI, emploi, PPI) : pages officielles lues par un outil web (le BLS refuse curl), recoupées entre la page
#   de chaque publication, le calendrier 2027 et le .ics du BLS.
# Pas encore publiés par la Fed, donc absents : les dates des minutes et des conférences de presse.
# Ce fichier finit le 30/06/2027 : la veille alerte (perp_news_calendar_ending) 30 jours avant.
# Le compléter ne demande aucun code : ajouter des [[event]], sans jamais réécrire une date passée.

