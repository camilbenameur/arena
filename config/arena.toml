# Arena configuration (paper MVP). Hashed into the journal on every load.
venue_mode = "paper"
# Deciders: "subscription" = claude -p on a Claude subscription; "api" = Console API key.
decider_backend = "subscription"
capital_eur = 1000
interval_s = 14400          # 4 h cycle
cycle_delay_s = 300         # decision at HH:05 UTC
fill_model_version = "pessimistic-v1"
taker_fee_bp = 50           # Kraken Pro base 0.40%, plus a 25% markup
slippage_bp = 5

# Continuous watch and event-driven wake-ups (docs/WATCH.md): an LLM-free tick every 5 min.
[watch]
tick_s = 300
move_threshold_bp = 300      # 3%
move_window_s = 3600    # over 1 h
cooldown_s = 3600             # minimum delay since the last LLM round (cycle or wake-up)
max_wakeups_per_day = 6          # per UTC day
pre_cycle_guard_s = 1800    # no wake-up within 30 min of the next scheduled cycle

[season]
# Season 1: 8 frozen weeks (config outside this table, risk policy, system prompt),
# ranked from the start cycle; the earlier shakedown period is excluded. This table and its comments are outside the frozen hash.
