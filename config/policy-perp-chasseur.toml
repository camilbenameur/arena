# Risk policy of the « Chasseur de mèches » (robot-perp:chasseur) AND of its witness (benchmark-perp:chasseur-5min),
# paper (docs/SPEC-CHASSEUR.md §5). Profile "aggressive" like config/policy-perp-conseil-v4.toml (the loader refuses a
# file of the other profile). OUTSIDE the retail 2x rule (AMF, decision D2): a paper demonstration that could not go
# live as it is. Hashed, journaled, copied into every verdict. Integers only; bp = 1/10 000 of the portfolio equity
# unless stated.
profile = "aggressive"

instruments = ["PF_XBTUSD", "PF_ETHUSD", "PF_SOLUSD", "PF_XRPUSD", "PF_LINKUSD", "PF_LTCUSD"]

# --- Size and leverage (entries only; reductions and closes are never capped) ---
# One entry is 2x the equity. Six contracts shocked at once would be 12x: the last entries are then shrunk
# (`run_intents(..., shrink=True)`), by the gross leverage cap and by the open risk below.
max_order_bp     = 20000   # one entry <= 200 % of equity in notional
max_position_bp  = 30000   # one instrument <= 300 % after the order (a contract at 200 % drifts up when the equity falls)
max_leverage_bp  = 100000  # gross exposure <= 10x equity; Kraken's initial margin (1 to 2 %) is checked too

# --- Loss at the stop (the stop must also come before the liquidation: LIQUIDATION_BEFORE_STOP) ---
# The rule puts a 5 % stop on every entry: 200 % x (5 % + the 1 % gap) = 12 % of the equity lost at one stop.
stop_bp_min        = 100   # stop distance from the expected fill: 1 % ...
stop_bp_max        = 1500  # ... to 15 %
max_trade_loss_bp  = 2500  # equity lost if the position's stop fills now, from the mark: <= 25 %
max_open_risk_bp   = 5900  # every stop at once: <= 59 % (the loader needs it under the halt, 60 %)
stop_gap_bp        = 100   # the loss at a stop assumes a fill 1 % beyond it, plus the simulator's slippage

# --- Cost versus expected move (riskd's edge rule, kept) ---
# The expected move of an entry (113 bp) is MEASURED offline (config/perp-chasseur.toml, with its source).
max_cost_to_expected_move_pct = 33
max_funding_horizon_h         = 168
max_expected_move_bp          = 3000
funding_extreme_e12           = 200000000

# --- Frequency ---
# Six contracts, a shock at most every two hours on each: 12 entries a day per contract at the very most.
max_opens_per_day          = 48
max_orders_per_minute      = 60
min_interval_same_open_s   = 0       # the rule's own lock (60 minutes after the exit) does the job

# --- Fees: no budget (0). The fees stay real and count in the result ---
monthly_fee_budget_bp = 0

# --- Freeze and halt ---
daily_loss_freeze_bp = 0      # no daily freeze
freeze_duration_s    = 3600   # only after a margin close-out (liquidation): 1 h without entries
drawdown_halt_bp     = 6000   # -60 % from the peak: flatten and halt

# --- Market sanity (entries only, kept as they are: a refusal in the middle of a wick is the real market) ---
max_mark_index_bp    = 100
max_mid_index_bp     = 200
max_mid_mark_bp      = 50
max_spread_multiple  = 3
max_data_age_s       = 600

# --- Minimum size ---
min_order_ueur = 5000000
