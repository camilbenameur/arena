# Configuration de l'arène (MVP paper). Hachée dans le journal à chaque chargement.
venue_mode = "paper"
# Décideurs : "abonnement" = claude -p sur l'abonnement du propriétaire (choix du 11/11/2026) ; "api" = clé Console.
decider_backend = "abonnement"
capital_eur = 1000
interval_s = 14400          # cycle de 4 h
cycle_delay_s = 300         # décision à HH:05 UTC
fill_model_version = "pessimiste-v1"
taker_fee_bp = 50           # 0,40 % Kraken Pro de base, majoré de 25 %
slippage_bp = 5

# Veille continue et réveils sur événement (docs/VEILLE.md) : un tick sans LLM toutes les 5 min.
[veille]
tick_s = 300
seuil_mouvement_bp = 300      # 3 %
fenetre_mouvement_s = 3600    # sur 1 h
cooldown_s = 3600             # délai minimal depuis la dernière ronde LLM (cycle ou réveil)
max_reveils_jour = 6          # par jour UTC
garde_avant_cycle_s = 1800    # aucun réveil à moins de 30 min du prochain rendez-vous

