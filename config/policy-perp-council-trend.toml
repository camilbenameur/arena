# Risk policy of the council v4 "Trend Council" (council-perp:trend) AND of its shadow
# (benchmark-perp:trend-engine), paper (docs/SPEC-TREND-COUNCIL.md §2). Target: net income on the order of 10% a day.
# Profile "aggressive" like config/policy-perp-council.toml (the loader refuses a file of the other profile), with
# the engine's own limits: the council's trend engine decides, the LLMs only brake. OUTSIDE the retail 2x rule
# (AMF): a paper demonstration that could not go live as it is. Hashed, journaled, copied into every
# verdict. Integers only; bp = 1/10,000 of the portfolio equity unless stated.
profile = "aggressive"

instruments = ["PF_XBTUSD", "PF_ETHUSD", "PF_SOLUSD", "PF_XRPUSD", "PF_LINKUSD", "PF_LTCUSD"]

# --- Size and leverage (entries only; reductions and closes are never capped) ---
# The engine caps a contract at 2x its weight, times the scale 2: 4x the equity, so one entry <= 400%. Its mean
# gross leverage is about 1.4x at scale 2 (0.7x at scale 1), with peaks of 4 to 6x.
max_order_bp     = 40000   # one entry <= 400% of equity in notional
max_position_bp  = 50000   # one instrument <= 500% after the order (a contract at 400% drifts up when the equity falls)
max_leverage_bp  = 100000  # gross exposure <= 10x equity; Kraken's initial margin (1 to 2%) is checked too

# --- Loss at the stop (the stop must also come before the liquidation: LIQUIDATION_BEFORE_STOP) ---
# The code puts a 5% stop on every position (tested on the bench: no effect on the result).
stop_bp_min        = 100   # stop distance from the expected fill: 1% ...
stop_bp_max        = 1500  # ... to 15%
max_trade_loss_bp  = 2500  # equity lost if the position's stop fills now, from the mark: <= 25%
max_open_risk_bp   = 5900  # every stop at once: <= 59% (the loader needs it under the halt, 60%)
stop_gap_bp        = 100   # the loss at a stop assumes a fill 1% beyond it, plus the simulator's slippage

# --- Cost versus expected move (riskd's edge rule, kept) ---
# The expected move of an order of the engine is MEASURED offline, not declared: it is the engine's mean gross
# move per trade on the TRAIN period of the bench (the first 64 days), written in config/perp-council-trend.toml
# with its source and passed as `expected_move_pct` of every order. The rule stays what it is for every player.
max_cost_to_expected_move_pct = 33
max_funding_horizon_h         = 168
max_expected_move_bp          = 3000
funding_extreme_e12           = 200000000

# --- Frequency ---
# 6 contracts x 6 bars = 36 adjustments a day at most, plus the veto rounds and the re-entries after a stop.
max_opens_per_day          = 48
max_orders_per_minute      = 60      # the council and its shadow both rebalance six contracts at a bar close
min_interval_same_open_s   = 0       # the engine decides every 4 hours: no delay needed

# --- Fees: no budget (0). The fees stay real and count in the result ---
monthly_fee_budget_bp = 0

# --- Freeze and halt ---
daily_loss_freeze_bp = 0      # no daily freeze
freeze_duration_s    = 3600   # only after a margin close-out (liquidation): 1 h without entries
drawdown_halt_bp     = 6000   # -60% from the peak: flatten and halt; an operator resumes it
                               # (python -m arena.perp.council resume)

# --- Market sanity (entries only, kept from the league's policy) ---
max_mark_index_bp    = 100
max_mid_index_bp     = 200
max_mid_mark_bp      = 50
max_spread_multiple  = 3
max_data_age_s       = 600

# --- Minimum size ---
min_order_ueur = 5000000
