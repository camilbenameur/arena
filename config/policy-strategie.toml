# Politique de risque des STRATEGIES de recherche (recherche-v1, PROTOCOLE §6 C15 et §9).
# Même clés que config/policy.toml (chargée par arene.risk.policy.load_policy, fichier haché).
#
# Principe : riskd ne doit jamais rejeter une règle de stratégie, il ne sert ici qu'à vérifier que les
# ordres d'une règle passent le vrai code de l'arène (liste blanche, cash, exposition <= 100 %, arrondis).
# Chaque valeur est donc la plus large que validate_policy accepte, sauf mention.
# Entiers uniquement. bp = 1/10 000 de l'equity.
#
# ECARTS DOCUMENTÉS à la politique des LLM (config/policy.toml) :
#  - max_order_bp / max_position_bp / max_exposure_bp : 10000 (une règle peut tenir 100 % sur un symbole,
#    la somme des poids est plafonnée à 100 % par la classe directionnel).
#  - max_trades_per_day : 12 = 6 ventes + 6 achats, une rotation complète des 6 paires à chaque décision.
#  - min_interval_same_symbol_s : 1 et non 0 (validate_policy exige > 0) ; sans effet pour une décision
#    par jour.
#  - stop_bp_min/max : 1 / 9999. RIEN NE PERMET de supprimer la règle STOP_REQUIRED : riskd rejette tout
#    achat sans stop. Le replay (recherche/portes/replay_arene.py) fournit donc stop_bp = 2500 à chaque
#    achat et ne simule PAS le stop (une règle de recherche n'a pas de stop) : contournement documenté.
#  - max_cost_to_expected_move_pct : 100 (maximum accepté) ; EDGE_TOO_SMALL exige aussi un mouvement attendu
#    déclaré > 0 : le replay fournit expected_move_bp = 10000 (contournement documenté, sans sens économique).
#  - max_holding_s : 10 ans. Appliquée par le simulateur (executor), pas par riskd ; le replay n'utilise pas
#    l'executor, donc aucune sortie forcée.
#  - daily_loss_freeze_bp, drawdown_halt_bp, monthly_fee_budget_bp : 10000 (jamais déclenchés avant la ruine).
#    Pour le paper (PROTOCOLE §9) la halte doit être au seuil de réfutation, propre à chaque candidat :
#    ce n'est pas calculable ici, à fixer à la promotion.
#  - max_quote_deviation_bp : 10000 ; max_spread_multiple : 3 (le replay fournit comme médiane le spread
#    courant, le rapport vaut 1). Non neutralisables car NO_QUOTE/PRICE_SANITY/SPREAD_ANOMALY exigent
#    des entrées cohérentes : le replay les fournit.
#  - min_order_ueur : 1 (le replay déclare des instruments sans minimum Kraken : biais documenté, le
#    plancher de 5 EUR de l'arène est ignoré, le capital simulé est de 10 000 EUR).

symbols = ["BTC/EUR", "ETH/EUR", "SOL/EUR", "XRP/EUR", "LINK/EUR", "LTC/EUR"]

max_order_bp    = 10000
max_position_bp = 10000
max_exposure_bp = 10000

max_trades_per_day         = 12
max_orders_per_minute      = 20
min_interval_same_symbol_s = 1

stop_bp_min = 1
stop_bp_max = 9999

max_cost_to_expected_move_pct = 100

max_holding_s = 315360000

daily_loss_freeze_bp = 10000
freeze_duration_s    = 86400
drawdown_halt_bp     = 10000

monthly_fee_budget_bp = 10000

max_quote_deviation_bp = 10000
max_spread_multiple    = 3

min_order_ueur = 1
