# Risk policy of the Haiku council (council-perp:haiku) ONLY, paper (docs/SPEC-PERP-COUNCIL-HAIKU.md §5). The goal is to
# trade aggressively and double the stake in a few days, which is impossible under
# config/policy-perp.toml (2x, 3 % per trade, freeze at -5 % over 24 h, halt at -15 %). OUTSIDE the retail 2x rule
# (AMF, decision D2): a paper demonstration that could not go live as it is. Hashed, journaled, copied into every
# verdict like the league's. Integers only; bp = 1/10 000 of the portfolio equity unless stated.
profile = "aggressive"

instruments = ["PF_XBTUSD", "PF_ETHUSD", "PF_SOLUSD", "PF_XRPUSD", "PF_LINKUSD", "PF_LTCUSD"]

# --- Size and leverage (entries only; reductions and closes are never capped) ---
max_order_bp     = 50000   # one entry <= 500 % of equity in notional
max_position_bp  = 100000  # one instrument <= 1000 % of equity after the order
max_leverage_bp  = 100000  # gross exposure <= 10x equity; Kraken's initial margin (1 to 2 %) is checked too

# --- Loss at the stop (the stop must also come before the liquidation: LIQUIDATION_BEFORE_STOP) ---
stop_bp_min        = 100   # stop distance from the expected fill: 1 % ...
stop_bp_max        = 1500  # ... to 15 %
max_trade_loss_bp  = 2500  # equity lost if the position's stop fills now, from the mark: <= 25 %
max_open_risk_bp   = 6000  # every stop at once: <= 60 %
stop_gap_bp        = 100   # the loss at a stop assumes a fill 1 % beyond it, plus the simulator's slippage

# --- Cost versus expected move (kept from the league's policy) ---
max_cost_to_expected_move_pct = 33
max_funding_horizon_h         = 168
max_expected_move_bp          = 3000
funding_extreme_e12           = 200000000

# --- Frequency ---
max_opens_per_day          = 24
max_orders_per_minute      = 20
min_interval_same_open_s   = 0      # no delay between two entries on the same instrument

# --- Fees: no budget (0). The fees stay real and count in the result ---
monthly_fee_budget_bp = 0

# --- Freeze and halt ---
daily_loss_freeze_bp = 0      # no daily freeze
freeze_duration_s    = 3600   # only after a margin close-out (liquidation): 1 h without entries
drawdown_halt_bp     = 9000   # -90 % from the peak (the "ruin"): flatten and halt; an operator resumes it
                               # (python -m arena.perp.council resume)

# --- Market sanity (entries only, kept from the league's policy) ---
max_mark_index_bp    = 100
max_mid_index_bp     = 200
max_mid_mark_bp      = 50
max_spread_multiple  = 3
max_data_age_s       = 600

# --- Minimum size ---
min_order_ueur = 5000000
