# Perp league, step 7: the LLM portfolios (docs/ETUDE-AGENTS-TRADERS.md §11, decisions D7, D8 and step 7 unblocked
# by the owner on 12/11/2026). Hashed (sha256 of the bytes) and journaled with every agent round.
enabled = true
# LLM wake-ups on from 13/11/2026 (the owner's decision, earlier than the two weeks of the study, step 7), within
# the watcher's limits: 3 % in 1 h, cooldown 1 h, 6 per UTC day, none 30 min before a rendez-vous or near a spot cycle.
wakeups = true
max_parallel = 4          # at most 4 `claude` processes at the same time (study §2.4)
timeout_s = 240           # per call (study §2.4)
max_budget_usd = "1.00"   # hard ceiling of one call (--max-budget-usd); a round costs 0.002 to 0.13 $ (step 6)
effort = "low"            # as in the spot league

# Daily budgets (D7, kept after step 6): equivalent USD per UTC day. A model over its budget skips its round
# (positions and stops stay in place) and the skip is journaled.
[[models]]
portfolio = "llm-perp:claude-haiku-5-5"
model = "claude-haiku-5-5"
daily_budget_usd = "0.10"
