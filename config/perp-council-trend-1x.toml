# The council v4, the "Trend Council" at 1x (docs/SPEC-TREND-COUNCIL.md), of the league of the councils. It replaces
# `council-perp:trend` (scale 2x), retired on axis 10 (docs/lead/LOG.md): at 2x the frozen engine lost 71.6% on 2020-2025
# (max drawdown -92%); at 1x it is the same engine with half the weights, the same stop, the same 4-hour rounds and the
# same brake rules. The engine (arena/perp/lab/trend.py, frozen, scale 1x) decides the target of each contract at every
# 4-hour bar close; three Haiku members and an Opus President may only brake it (a coefficient of 1, 0.5 or 0 per
# contract); the code executes. Its shadow `benchmark-perp:trend-engine-1x` plays the same target without the LLMs.
# Hashed (sha256 of the bytes) and journaled with each round.
kind = "trend-v4"
enabled = true
portfolio = "council-perp:trend-1x"
name = "Trend Council 1x"
model = "claude-haiku-5-5"            # the three members
president_model = "claude-opus-5-5"
# A round is three Haiku calls and one Opus call (about 0.06 to 0.10 $); 6 to 10 rounds a day: under 1 $ a day.
# A ceiling against a runaway, not a target.
daily_budget_usd = "5.00"
members_parallel = 3
member_timeout_s = 90
president_timeout_s = 150
member_max_tool_calls = 2   # read-only checks of a fact (the Data Controller); no tool places an order
# Its own risk policy, profile "aggressive" (a file of config/), shared with its shadow
policy = "policy-perp-council-trend-1x.toml"

# --- the engine's execution ---
benchmark = "benchmark-perp:trend-engine-1x"
engine_scale = "1.0"         # the frozen engine at 1x (the first Trend Council ran it at 2x: axis 10)
rebalance_band_bp = 500     # an order only when the final target is farther than 5% of the equity from the position
stop_pct = "5"              # the protective stop the code puts on every position (bench: no effect on the result)
# riskd's edge rule (cost <= 33% of the expected move) judges a move that an LLM declares. The engine does not
# declare one: it is MEASURED offline and given with every order. expected_move_bp is the engine's mean gross move per
# trade (side x (exit - entry) / entry, before fees, slippage and funding). INHERITED from the 2x council on purpose:
# it is a move in PRICE per trade, which the scale (a multiplier of the weights) does not change; 247 bp is the
# conservative one. Re-measured on 2026-11-28 on the same TRAIN window (arena.perp.lab.backtest, 5% stop) the stored
# data gives 16 trades, mean gross +3.28% at 2x and +3.79% at 1x (mean holding 230 h; the 2x figure does not
# reproduce the original 20 trades and +2.47%: the store has been reloaded since). The lower, original figure is kept.
expected_move_bp = 247
expected_move_source = "inherited from council-perp:trend (2x), arena.perp.lab.backtest on var-perp/data/kraken_futures, trend.FROZEN, stop 5%, TRAIN only (2026-08-14 to 2026-10-17): 20 trades, mean gross +2.47% per trade, mean holding 184 h; a price move per trade does not depend on the scale; re-measured 2026-11-28 at 1x: 16 trades, +3.79%, 230 h (higher, so the inherited figure stays the conservative one)"
horizon_h = 168
