[project]
name = "arena"
version = "0.1.0"
description = "Trading arena: AI models decide, code validates, everything is journaled and measured honestly."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "anthropic>=0.40",
]

[project.scripts]
arena = "arena.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
]
research = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
]

[tool.uv]
default-groups = ["dev", "research"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test that calls a public API (deselect with -m 'not network')",
    "real_data: test that reads var/research/data (skipped when the folder is missing)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
